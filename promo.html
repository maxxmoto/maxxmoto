<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скидка 10% на всё — MAXXMOTO</title>
    <meta name="description" content="Скидка 10% на всю мототехнику MAXXMOTO: эндуро, питбайки, круизёры, спорт и квадроциклы. Выбирайте категорию и переходите в каталог со скидкой.">
    <link rel="icon" type="image/jpeg" href="static/maxxmotofaviconjfif.jfif">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #f5f5f7;
        }
        .promo {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0)),
                url('static/promoback.webp') center/cover no-repeat;
        }
        /* основная сетка: слева категории | 10% | справа текст */
        .promo-inner {
            position: relative; z-index: 3;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            padding: 0 clamp(1rem, 4vw, 4rem);
        }
        .promo-left {
            display: flex; flex-direction: column; align-items: flex-start;
            gap: clamp(0.4rem, 1.2vh, 1rem);
        }
        .cat-link {
            font-size: clamp(24px, 3.6vw, 52px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.02em;
            color: #141414;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
        }
        .cat-link:hover { color: #ff3b3b; transform: translateX(5px); opacity: 0.9; }
        /* 10% по центру, обрезано снизу */
        .promo-big {
            font-size: clamp(160px, 32vw, 400px);
            font-weight: 900;
            line-height: 1;
            text-align: center;
            color: #ff3b3b;
            letter-spacing: -0.05em;
            transform: translateY(13%);
            pointer-events: none;
            white-space: nowrap;
        }
        .promo-right {
            font-size: clamp(22px, 2.8vw, 44px);
            font-weight: 900;
            line-height: 1.05;
            color: #141414;
            text-align: left;
            letter-spacing: 0.01em;
        }
        .promo-foot {
            position: relative; z-index: 4;
            text-align: center;
            padding: 0.6rem 1rem;
            font-size: 0.8rem; color: rgba(0,0,0,0.6);
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(6px);
        }
        .promo-foot a { color: rgba(0,0,0,0.75); text-decoration: underline; }
        /* мобилка */
        @media (max-width: 760px) {
            .promo-inner {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                gap: 1rem;
                padding: 0.5rem 1.25rem;
                justify-items: center;
            }
            .promo-left { align-items: center; gap: 0.45rem; }
            .cat-link { font-size: clamp(22px, 7vw, 38px); }
            .promo-big { font-size: clamp(140px, 48vw, 280px); transform: translateY(12%); }
            .promo-right { text-align: center; font-size: clamp(20px, 6vw, 32px); }
        }
    </style>
</head>
<body>
    <main class="promo">
        <div class="promo-inner">
            <div class="promo-left">
                <a class="cat-link" href="index.html?category=enduro#catalog">ЭНДУРО</a>
                <a class="cat-link" href="index.html?category=dirt#catalog">ПИТБАЙКИ</a>
                <a class="cat-link" href="index.html?category=cruiser#catalog">КРУИЗЁРЫ</a>
                <a class="cat-link" href="index.html?category=sport#catalog">СПОРТ</a>
                <a class="cat-link" href="index.html?category=adventure#catalog">КВАДРОЦИКЛЫ</a>
            </div>
            <div class="promo-big" aria-hidden="true">10%</div>
            <div class="promo-right">ДО КОНЦА<br>МЕСЯЦА</div>
        </div>
        <footer class="promo-foot">
            © 2026 MAXXMOTO · <a href="index.html">На главную</a> · <a href="https://t.me/maaxxrr" target="_blank" rel="noopener">Telegram</a>
        </footer>
    </main>
</body>
</html>
